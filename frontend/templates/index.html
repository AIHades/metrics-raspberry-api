<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/mainpage.css') }}">
    <script src="{{ url_for('static', path='js/mainpage.js') }}" defer></script>
</head>
<body>
    <main class="page">
        <h1 class="page-title">Machine metrics</h1>

        <div class="board">

        <article class="metric-card" data-max="100" data-unit="°C">
            <div class="gauge gauge--temp" role="img" aria-label="Temperature">
                <svg viewBox="0 0 120 120">
                    <circle class="gauge-track" cx="60" cy="60" r="52"/>
                    <circle class="gauge-fill"  cx="60" cy="60" r="52"/>
                </svg>
                <div class="gauge-readout">
                    <span id="temperature">--</span><small>°C</small>
                </div>
            </div>
            <p class="metric-label">Temperature</p>
        </article>

        <article class="metric-card" data-max="100" data-unit="%">
            <div class="gauge gauge--battery" role="img" aria-label="Battery">
                <svg viewBox="0 0 120 120">
                    <circle class="gauge-track" cx="60" cy="60" r="52"/>
                    <circle class="gauge-fill"  cx="60" cy="60" r="52"/>
                </svg>
                <div class="gauge-readout">
                    <span id="battery">--</span><small>%</small>
                </div>
            </div>
            <p class="metric-label">Battery</p>
        </article>

        <article class="metric-card" data-max="100" data-unit="%">
            <div class="gauge gauge--memory" role="img" aria-label="Memory usage">
                <svg viewBox="0 0 120 120">
                    <circle class="gauge-track" cx="60" cy="60" r="52"/>
                    <circle class="gauge-fill"  cx="60" cy="60" r="52"/>
                </svg>
                <div class="gauge-readout">
                    <span id="memory-percentage">--</span><small>%</small>
                </div>
            </div>
            <p class="metric-label">Memory</p>
        </article>

        <article class="metric-card metric-card--flip" data-max="100" data-unit="%" tabindex="0" role="button" aria-pressed="false" aria-label="Disk usage — click for details">
            <div class="card-inner">

                <div class="card-face card-face--front">
                    <div class="gauge gauge--disk" role="img" aria-label="Disk usage percentage">
                        <svg viewBox="0 0 120 120">
                            <circle class="gauge-track" cx="60" cy="60" r="52"/>
                            <circle class="gauge-fill"  cx="60" cy="60" r="52"/>
                        </svg>
                        <div class="gauge-readout">
                            <span id="disk_usage_percentage">--</span><small>%</small>
                        </div>
                    </div>
                    <p class="metric-label">Disk /</p>
                </div>

                <div class="card-face card-face--back">
                    <p class="metric-label">Disk /</p>
                    <div class="disk-stat">
                        <span id="disk_usage_gigabyte">--</span><small>GB used</small>
                    </div>
                    <div class="disk-stat disk-stat--total">
                        <span id="total_disk_gigabyte">--</span><small>GB total</small>
                    </div>
                </div>

            </div>
        </article>

        </div>
    </main>
</body>
</html>
